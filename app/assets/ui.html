<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>APK Studio</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#1b2130;--mut:#6b7389;--line:#e2e6ef;--pri:#3b5bdb;--red:#e03131;--grn:#2b8a3e}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f29;--ink:#e8ebf3;--mut:#9aa3b8;--line:#2a3140;--pri:#6c86ff;--red:#ff6b6b;--grn:#51cf66}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Noto Sans Bengali",sans-serif;display:flex;flex-direction:column}
#top{background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
#top b{font-size:17px}#top .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:13px}
#chg{background:var(--pri);color:#fff;border-radius:99px;padding:2px 10px;font-size:12px;display:none}
#tabs{display:none;overflow-x:auto;white-space:nowrap;background:var(--card);border-bottom:1px solid var(--line);padding:6px 8px;gap:6px}
#tabs button{flex:0 0 auto;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font:inherit;font-size:14px}
#tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#main{flex:1;overflow:auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button{font:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:9px 14px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:var(--red)}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.5}
.btn.big{width:100%;padding:14px;font-size:17px}
input[type=text],input[type=password],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.u{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.b{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut);margin:2px 3px 2px 0}
.b.ok{color:var(--grn);border-color:var(--grn)}.b.rm{color:var(--red);border-color:var(--red)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}.row>input{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.im{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:11px;word-break:break-all;background:var(--card)}
.im .th{height:72px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/12px 12px;border-radius:8px;margin-bottom:5px}
.im img{max-width:100%;max-height:72px}
.note{background:rgba(240,140,0,.12);border:1px solid rgba(240,140,0,.45);border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}
pre{background:#0d1117;color:#c9d1d9;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto}
label.ck{display:flex;gap:8px;align-items:center;font-size:14px}
input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;padding:0;background:none}
.hero{text-align:center;padding:30px 10px}.hero .ic{font-size:64px}
.hero h2{margin:6px 0}
.perm{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;font-family:ui-monospace,monospace;word-break:break-all}
.perm:last-child{border:0}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.loc{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.loc .ic{flex:0 0 auto;font-size:16px}.loc .tx{min-width:0;flex:1}
.loc .sn{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--mut);word-break:break-all;margin-top:2px}
.loc mark{background:rgba(240,140,0,.28);color:inherit;border-radius:3px}
.eff{background:rgba(59,91,219,.09);border:1px solid rgba(59,91,219,.35);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
.warn{background:rgba(240,140,0,.12);border:1px solid rgba(240,140,0,.45);border-radius:10px;padding:8px 10px;font-size:13px;margin-top:8px}
h3.sec{margin:16px 4px 8px;font-size:14px;color:var(--mut)}
details summary{cursor:pointer;color:var(--pri);font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div id="top"><b>📱 APK Studio</b><span class="nm" id="nm"></span><span id="chg"></span></div>
<div id="tabs"></div>
<div id="main"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null, ops=[], TAB='urls', BUSY=false, built=null;

/* ---------- native bridge ---------- */
const cbs={};let cbn=0;
function nat(method,args){return new Promise((res,rej)=>{const id=++cbn;cbs[id]={res,rej};Android.call(method,JSON.stringify(args||{}),String(id))})}
window.__cb=(id,ok,payload)=>{const c=cbs[id];if(!c)return;delete cbs[id];if(ok){try{c.res(JSON.parse(payload))}catch(e){c.res(payload)}}else c.rej(new Error(payload))};
window.__prog=m=>{const l=$('#log');if(l){l.textContent+=m+'\n';l.scrollTop=l.scrollHeight}};
window.__back=()=>{if(S&&TAB==='pages'&&pg){pg=null;tab('pages');return true}if(S&&TAB!=='pages'){tab('pages');return true}return false};

/* ---------- ops ---------- */
const keyOf=o=>o.t+':'+(o.t==='str'?o.old+'|'+!!o.exact:o.t==='delperm'?o.name:o.t==='delfile'||o.t==='repfile'?o.path:o.pos);
function setOp(o){ops=ops.filter(x=>keyOf(x)!==keyOf(o));ops.push(o);built=null;upd()}
function delIdx(i){ops.splice(i,1);built=null;upd()}
function delOp(k){ops=ops.filter(x=>keyOf(x)!==k);built=null;upd()}
const getOp=(t,v)=>ops.find(o=>o.t===t&&(t==='str'?o.old===v&&!o.exact:t==='delperm'?o.name===v:t==='delfile'||t==='repfile'?o.path===v:o.pos===v));
function upd(){const c=$('#chg');c.style.display=ops.length?'':'none';c.textContent=ops.length+' পরিবর্তন';tab(TAB,true)}
function effUrl(u){for(const o of ops)if(o.t==='str'&&!o.exact&&u.includes(o.old))u=u.split(o.old).join(o.new);return u}
const toast=m=>{let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:9;font-size:14px;transition:.2s';document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,2200)};
const fail=e=>{BUSY=false;toast('❌ '+e.message);console.log(e)};

/* ---------- home ---------- */
function home(){S=null;ops=[];built=null;$('#tabs').style.display='none';$('#nm').textContent='';$('#chg').style.display='none';
  $('#main').innerHTML=`<div class="hero"><div class="ic">📦</div><h2>APK এডিট করুন</h2>
  <p class="mut">যেকোনো APK বেছে নিন — ভেতরের <b>URL, অ্যাপের নাম, টেক্সট, রং, আইকন/ছবি, পারমিশন</b> বদলে নতুন সাইন করা APK বানান। সোর্স কোড লাগবে না। সবকিছু আপনার ফোনেই হয়, কোথাও আপলোড হয় না।</p>
  <button class="btn big" onclick="pick()">📂 APK ফাইল বাছুন</button></div>
  <div class="note">⚠ শুধু নিজের অ্যাপ বা যে অ্যাপ বদলানোর অনুমতি আছে সেটাতেই ব্যবহার করুন।</div>`}
async function pick(){
  try{const r=await nat('pickApk');if(r.cancelled)return;
  $('#main').innerHTML=`<div class="card"><span class="spin"></span>${esc(r.name)} স্ক্যান হচ্ছে... (বড় অ্যাপে কিছুক্ষণ লাগে)</div>`;
  S=await nat('scan');S.name=r.name;ops=[];built=null;$('#nm').textContent=r.name;$('#tabs').style.display='flex';TAB='pages';pg=null;tab('pages')}catch(e){fail(e);home()}}

/* ---------- tabs ---------- */
const TABS=[['pages','📄 পেজ'],['urls','🔗 লিংক'],['text','✏️ টেক্সট'],['color','🎨 রং'],['img','🖼️ ছবি'],['perm','🔐 পারমিশন'],['find','🔎 খুঁজুন'],['files','📁 ফাইল'],['build','📦 বিল্ড']];
function tab(t,keep){TAB=t;if(!S)return;const sc=keep?$('#main').scrollTop:0;
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===t?'on':''}" onclick="tab('${k}')">${l}</button>`).join('')+`<button onclick="if(confirm('নতুন APK বাছতে চান? অসেভ পরিবর্তন হারাবে।'))home()">↩ নতুন APK</button>`;
  ({pages:vPages,urls:vUrls,text:vText,color:vColor,img:vImg,perm:vPerm,find:vFind,files:vFiles,build:vBuild})[t]();$('#main').scrollTop=sc}

/* Pages */
let pg=null;
const topCls=c=>c.split('#')[0].split('$')[0];
function ownHtml(o){const [h,calls]=o.split('|');const [c,m]=h.split('#');const sc=c.split('.').slice(-2).join('.');
  const what=!m?'':m.startsWith('ফিল্ড:')?`ধ্রুবক (field) <b>${esc(m.slice(6))}</b>`:`মেথড <b>${esc(m)}()</b>`;
  return `<div>ক্লাস <b>${esc(sc)}</b>${what?' → '+what:''}</div>`+(calls?`<div class="mut">এই মেথড ডাকে: ${esc(calls.split(',').join(', '))}</div>`:'')}
function buildPages(){
  const acts=(S.activities||[]),P=new Map();
  const get=(key,ic,name,sub,kind,file)=>{if(!P.has(key))P.set(key,{key,ic,name,sub,kind,file,urls:new Map()});return P.get(key)};
  acts.forEach(a=>get('A:'+a,'📱',a.split('.').pop(),a,'act'));
  const actOf=c=>{const t=topCls(c);return acts.find(a=>a===t)};
  S.urls.forEach(u=>{if(NOISE.some(n=>u.url.includes(n))&&!unoise)return;
    (u.locs||[]).forEach(l=>{let p;
      if(l.kind==='code'){const cs=(l.owners&&l.owners.length)?l.owners:['(অজানা ক্লাস)'];
        cs.forEach(c=>{const a=actOf(c);p=a?get('A:'+a):get('C:'+topCls(c),'⚙️',topCls(c).split('.').pop(),topCls(c)+' (সার্ভিস/হেল্পার ক্লাস)','cls');add(p,u,l)});return}
      if(l.kind==='page')p=get('F:'+l.file,'🌐',l.file.split('/').pop(),l.file+' (ওয়েব পেজ)','file',l.file);
      else if(l.kind==='config')p=get('F:'+l.file,'🗂️',l.file.split('/').pop(),l.file+' (কনফিগ ফাইল)','file',l.file);
      else if(l.kind==='layout')p=get('F:'+l.file,'🧩',l.file.split('/').pop(),l.file+' (স্ক্রিন ডিজাইন)','file',l.file);
      else if(l.kind==='manifest')p=get('M','📋','ম্যানিফেস্ট','AndroidManifest.xml','file','AndroidManifest.xml');
      else p=get('R','🔤','অ্যাপের টেক্সট/সেটিংস','resources (strings) — কোন পেজে ব্যবহার হয় কোড থেকে জানা যায় না','res');
      add(p,u,l)})});
  function add(p,u,l){if(!p.urls.has(u.url))p.urls.set(u.url,u)}
  P.forEach(p=>{if(p.kind!=='file')return;const o=ops.find(o=>o.t==='textfile'&&o.path===p.file);if(!o)return;
    p.urls=new Map();(o.content.match(/https?:\/\/[^\s"'<>\\)}\]`]+/g)||[]).forEach(m=>{m=m.replace(/[.,;:']+$/,'');if(m.length<11)return;
      const at=o.content.indexOf(m),ls=o.content.lastIndexOf('\n',at)+1,le=o.content.indexOf('\n',at);
      if(!p.urls.has(m))p.urls.set(m,{url:m,count:1,where:[p.file],locs:[{file:p.file,kind:'page',n:1,snip:o.content.slice(ls,le<0?undefined:le).trim().slice(0,150)}]})})});
  const rank={act:0,file:1,cls:2,res:3};
  return [...P.values()].sort((a,b)=>(rank[a.kind]-rank[b.kind])||(b.urls.size-a.urls.size))}
function vPages(){
  const L=buildPages();window._pl=L;
  if(pg!==null&&L[pg])return vPage(pg);
  const nAct=L.filter(p=>p.kind==='act').length;
  const btn=(p,i)=>`<button class="im" style="cursor:pointer;color:var(--ink);font:inherit;font-size:12px;${p.urls.size?'':'opacity:.5'}" onclick="pg=${i};tab('pages')"><div style="font-size:28px">${p.ic}</div><b>${esc(p.name)}</b><br><span class="b ${p.urls.size?'ok':''}">${p.urls.size} লিংক</span></button>`;
  const sec=(t,k)=>{const l=L.map((p,i)=>[p,i]).filter(([p])=>k.includes(p.kind));return l.length?`<h3 class="sec">${t} (${l.length})</h3><div class="grid">${l.map(([p,i])=>btn(p,i)).join('')}</div>`:''};
  $('#main').innerHTML=`<div class="note">💡 <b>পেজ</b> = অ্যাপের একেকটা স্ক্রিন (Activity), ওয়েব পেজ ফাইল ও কনফিগ ফাইল। যেকোনো পেজের বাটনে চাপুন — ওই পেজে কোন কোন লিংক আছে দেখাবে এবং সেখান থেকেই বদলাতে পারবেন।</div>
  <div class="card mut">অ্যাপে ${nAct} টি স্ক্রিন (Activity) পাওয়া গেছে। ${L.filter(p=>p.kind==='act'&&p.urls.size).length} টিতে সরাসরি লিংক আছে। (ধূসর = লিংক নেই)</div>`+
  sec('📱 অ্যাপের স্ক্রিন',['act'])+sec('🌐 ফাইল/ওয়েব পেজ',['file'])+sec('⚙️ হেল্পার/API ক্লাস',['cls'])+sec('🔤 রিসোর্স',['res'])}
function vPage(i){
  const p=window._pl[i],list=[...p.urls.values()];window._ul=list;
  const fileOp=p.file&&ops.find(o=>o.t==='textfile'&&o.path===p.file);
  $('#main').innerHTML=`<button class="btn sec sm" onclick="pg=null;tab('pages')">‹ সব পেজ</button>
  <div class="card" style="margin-top:8px"><div style="font-size:30px">${p.ic}</div><b>${esc(p.name)}</b><div class="u mut">${esc(p.sub)}</div><div style="margin-top:6px"><span class="b ok">${list.length} টি লিংক</span></div>
  ${p.kind==='file'&&p.file!=='AndroidManifest.xml'?`<div class="row"><button class="btn sec sm" onclick="openIn('${esc(p.file).replace(/'/g,"\\'")}')">📁 ফাইলটা পুরো খুলুন</button></div>`:''}
  <div class="mut" style="margin-top:6px">${p.kind==='file'&&p.file!=='AndroidManifest.xml'?'"শুধু এই পেজে" বাটনে বদলালে অন্য পেজের একই লিংক বদলাবে না। "সব জায়গায়" বাটনে পুরো অ্যাপে বদলাবে।':'⚠ কোডের লিংক বদলালে অ্যাপের সব জায়গায় (সব পেজে) একই লিংক বদলে যাবে।'}</div></div>`+
  (list.length?list.map((u,j)=>{const e=effUrl(u.url),ch=e!==u.url,op=getOp('str',u.url),k=urlType(u.url),mine=(u.locs||[]).filter(l=>l.kind==='code'?(l.owners||[]).some(c=>p.kind==='act'?topCls(c)===p.sub:p.kind==='cls'?topCls(c)===p.sub.split(' ')[0]:true):l.file===p.file||p.kind==='res');
    const fo=p.kind==='file'&&p.file!=='AndroidManifest.xml';
    return `<div class="card"><div><span class="b">${k[0]} ${k[1]}</span>${ch?'<span class="b ok">✓ পরিবর্তিত</span>':''}</div><div class="u" style="margin-top:4px">${esc(u.url)}</div>
    ${(mine.length?mine:u.locs||[]).slice(0,3).map(x=>locHtml(u.url,{...x,owners:(x.owners||[]).filter(c=>p.kind==='act'?topCls(c)===p.sub:p.kind==='cls'?topCls(c)===p.sub.split(' ')[0]:true)},S.package)).join('')}
    <div class="row"><input type="text" id="u${j}" value="${esc(e)}" placeholder="নতুন লিংক" oninput="prevUrl(${j})"></div>
    <div class="row">${fo?`<button class="btn sm" onclick="saveHere(${j},${i})">শুধু এই পেজে</button>`:''}<button class="btn ${fo?'sec ':''}sm" onclick="saveUrl(${j})">সব জায়গায়</button>${op?`<button class="btn sec sm" onclick="delIdx(${ops.indexOf(op)})">↺</button>`:''}</div>
    <div id="p${j}">${ch?effHtml(u.url,e):'<div class="mut" style="margin-top:6px">নতুন লিংক লিখলে নিচে দেখাবে কোথায় কী বদলাবে।</div>'}</div></div>`}).join(''):'<div class="card mut">এই পেজে কোনো লিংক পাওয়া যায়নি।</div>')}
async function saveHere(j,i){ // শুধু এই ফাইলে বদল
  const p=window._pl[i],u=window._ul[j],v=$('#u'+j).value.trim();if(!v||v===u.url)return toast('কিছু বদলায়নি');
  try{const old=ops.find(o=>o.t==='textfile'&&o.path===p.file);
    const text=old?old.content:(await nat('readFile',{path:p.file})).text;
    if(!text.includes(u.url))return toast('এই ফাইলে আর লিংকটা নেই (আগেই বদলানো?)');
    ops=ops.filter(o=>!(o.t==='textfile'&&o.path===p.file));
    ops.push({t:'textfile',path:p.file,content:text.split(u.url).join(v)});built=null;
    upd();toast('✅ শুধু '+p.name+' এ বদলানো হয়েছে')}catch(e){fail(e)}}

/* URLs */
const NOISE=['schemas.android.com','www.w3.org','xmlpull.org','apache.org','developer.android.com','docs.oracle.com','purl.org','ns.adobe.com','example.com','localhost'];
let uq='',unoise=false;
const KIND={code:['⚙️','অ্যাপের কোডে','অ্যাপ চালু হলে/কাজ করার সময় এই লিংকে ডাটা বা পেজ চাইবে'],
 resource:['🔤','অ্যাপের সেটিংস/টেক্সটে (resources)','অ্যাপের ভেতরের সেটিং বা লেখায় এই লিংক ব্যবহার হয়'],
 manifest:['📋','ম্যানিফেস্টে','অ্যাপের মূল তথ্যে (যেমন deep link) এই লিংক আছে'],
 layout:['🧩','স্ক্রিন/লেআউট ফাইলে','কোনো স্ক্রিনের ডিজাইন ফাইলে এই লিংক আছে'],
 page:['🌐','ওয়েব পেজ ফাইলে (WebView)','অ্যাপের ভেতরে দেখানো এই পেজের লিংক বদলাবে'],
 config:['🗂️','কনফিগ ফাইলে','কনফিগ ফাইলের ভেতরের মান বদলাবে']};
function urlType(u){const l=u.toLowerCase();
  if(/firebaseio\.com|firebase|googleapis\.com\/(identitytoolkit|fcm)|firebasestorage|appspot\.com/.test(l))return['🔥','Firebase/গুগল সার্ভিস'];
  if(/play\.google\.com|market:\/\/|facebook\.com|instagram\.com|youtube\.com|youtu\.be|t\.me|wa\.me|twitter\.com|x\.com|tiktok\.com/.test(l))return['🔗','স্টোর/সোশ্যাল লিংক'];
  if(/privacy|terms|policy|tos|licen[cs]e/.test(l))return['📄','গোপনীয়তা/শর্তের পেজ'];
  if(/\/api\b|\/api\/|api\.|\/v\d+\/|\.php|\.json|graphql|\/rest\/|login|auth|token/.test(l))return['🛰️','API / সার্ভার'];
  if(/\.(png|jpe?g|gif|webp|svg|mp4|mp3|pdf)(\?|$)/.test(l))return['🖼️','ছবি/ফাইলের লিংক'];
  return['🌐','ওয়েবসাইট/সার্ভার'];}
const hl=(t,u)=>{const i=t.indexOf(u);return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(u)+'</mark>'+esc(t.slice(i+u.length))};
const shortCls=c=>c.split('.').slice(-2).join('.');
function locHtml(u,l,pkg){
  const k=KIND[l.kind]||KIND.config;
  let own='';
  if(l.owners&&l.owners.length){
    const pp=(pkg||'').split('.').slice(0,2).join('.');
    const o=[...l.owners].sort((a,b)=>(pp&&b.startsWith(pp))-(pp&&a.startsWith(pp)));
    own=l.kind==='code'?o.slice(0,3).map(ownHtml).join(''):`<div>নাম: <b>${esc(o.slice(0,2).join(', '))}</b></div>`}
  const open=(l.kind==='page'||l.kind==='config')?` <a href="#" onclick="openIn('${esc(l.file).replace(/'/g,"\\'")}');return false" style="color:var(--pri)">ফাইল খুলুন ›</a>`:'';
  return `<div class="loc"><div class="ic">${k[0]}</div><div class="tx"><div><b>${k[1]}</b> <span class="mut">· ${esc(l.file)}${l.n>1?' · '+l.n+'×':''}</span>${open}</div>${own}
   <div class="sn">${hl(l.snip||'',u)}</div></div></div>`}
function impact(old,nw){ // বদলালে কোন কোন লিংক/ফাইলে কী হবে
  const hit=S.urls.filter(x=>x.url.includes(old)),files=new Set();let n=0;
  hit.forEach(x=>{n+=x.count;(x.locs||[]).forEach(l=>files.add(l.file))});
  return{hit,files:[...files],n}}
function effHtml(u,e){
  const im=impact(u,e),others=im.hit.filter(x=>x.url!==u);
  let h=`<div class="eff">📍 <b>${im.n} জায়গায়</b>, ${im.files.length} টি ফাইলে এই লিংক বদলাবে:<br><span class="u">${im.files.slice(0,6).map(esc).join('<br>')}${im.files.length>6?'<br>…আরও '+(im.files.length-6)+' টি':''}</span></div>`;
  if(others.length)h+=`<div class="warn">⚠ এই লিংকটি আরও ${others.length} টি লম্বা লিংকের শুরুতে আছে, সেগুলোও বদলে যাবে:<br><span class="u">${others.slice(0,3).map(x=>esc(x.url)+' → '+esc(x.url.split(u).join(e))).join('<br>')}${others.length>3?'<br>…':''}</span></div>`;
  return h}
function vUrls(){
  const all=S.urls.map(u=>({...u,noise:NOISE.some(n=>u.url.includes(n)),type:urlType(u.url)}));
  const l=all.filter(u=>(unoise||!u.noise)&&(effUrl(u.url)+u.url).toLowerCase().includes(uq.toLowerCase()));
  const groups={};l.forEach(u=>(groups[u.type[1]]=groups[u.type[1]]||[]).push(u));
  const order=Object.keys(groups).sort((a,b)=>(a==='ওয়েবসাইট/সার্ভার')-(b==='ওয়েবসাইট/সার্ভার'));
  window._ul=[];let idx=0,shown=0;
  const cards=order.map(g=>{const items=groups[g].map(u=>{
    if(shown>=300)return'';shown++;const i=idx++;window._ul.push(u);
    const e=effUrl(u.url),ch=e!==u.url,op=getOp('str',u.url),k=u.type;
    return `<div class="card"><div><span class="b">${k[0]} ${k[1]}</span>${ch?'<span class="b ok">✓ পরিবর্তিত</span>':''}<span class="b">${u.count}× মোট</span></div>
     <div class="u" style="margin-top:4px">${esc(u.url)}</div>
     ${(u.locs||[]).map(x=>locHtml(u.url,x,S.package)).join('')||u.where.map(w=>`<span class="b">${esc(w)}</span>`).join('')}
     <div class="row"><input type="text" id="u${i}" value="${esc(e)}" placeholder="নতুন লিংক" oninput="prevUrl(${i})"><button class="btn sm" onclick="saveUrl(${i})">সেভ</button></div>
     <div id="p${i}">${ch?effHtml(u.url,e):`<div class="mut" style="margin-top:6px">নতুন লিংক লিখলে নিচে দেখাবে কোথায় কী বদলাবে।</div>`}</div>
     ${op?`<div class="row"><button class="btn sec sm" onclick="delIdx(${ops.indexOf(op)})">↺ ফিরিয়ে নিন</button></div>`:''}</div>`}).join('');
    return items?`<h3 class="sec">${groups[g][0].type[0]} ${g} (${groups[g].length})</h3>`+items:''}).join('');
  $('#main').innerHTML=`<div class="note">💡 <b>কীভাবে বুঝবেন:</b> প্রতিটি কার্ডে লিংকের নিচে দেখানো আছে সেটা <b>কোন ফাইল/ক্লাস/পেজে</b> আছে ও আশেপাশের লেখা (হলুদ = লিংকটি)। নতুন লিংক লিখলে সাথে সাথে দেখাবে <b>কোথায় কী বদলাবে</b>। তারপর <b>সেভ</b> → <b>📦 বিল্ড</b>।</div>
  <div class="card"><b>পুরো ডোমেইন একসাথে বদলান</b><div class="mut">যেমন https://old.com → https://new.com (কোড, রিসোর্স, ম্যানিফেস্ট, assets সব জায়গায়)</div>
  <div class="row"><input type="text" id="bo" placeholder="পুরনো, যেমন https://old.com" oninput="prevBulk()"></div><div class="row"><input type="text" id="bn" placeholder="নতুন, যেমন https://new.com" oninput="prevBulk()"><button class="btn" onclick="bulk()">বদলান</button></div><div id="bp"></div></div>
  <div class="card"><input type="text" id="uq" placeholder="🔎 ফিল্টার..." value="${esc(uq)}" oninput="uq=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{vUrls();const i=$('#uq');i.focus();i.setSelectionRange(99,99)},300)">
  <label class="ck" style="margin-top:8px"><input type="checkbox" ${unoise?'checked':''} onchange="unoise=this.checked;vUrls()"> সিস্টেম/লাইব্রেরির লিংকও দেখান</label><div class="mut" style="margin-top:4px">${l.length} টি লিংক</div></div>`+cards+(l.length>300?'<p class="mut">আরও আছে — ফিল্টার ব্যবহার করুন</p>':'')}
function prevUrl(i){const u=window._ul[i],v=$('#u'+i).value.trim();$('#p'+i).innerHTML=(v&&v!==u.url)?effHtml(u.url,v):'<div class="mut" style="margin-top:6px">কিছু বদলায়নি</div>'}
function prevBulk(){const o=$('#bo').value.trim(),n=$('#bn').value.trim();$('#bp').innerHTML=o&&n&&o!==n?(S.urls.some(x=>x.url.includes(o))?effHtml(o,n):'<div class="warn">এই লেখা কোনো লিংকে পাওয়া যায়নি (তবে কোডের অন্য টেক্সটে থাকলে তা-ও বদলাবে)।</div>'):''}
function saveUrl(i){const u=window._ul[i],v=$('#u'+i).value.trim();if(!v||v===effUrl(u.url))return toast('কিছু বদলায়নি');setOp({t:'str',old:u.url,new:v,exact:false});toast('✅ যোগ হয়েছে — বিল্ড ট্যাবে গিয়ে তৈরি করুন')}
function bulk(){const o=$('#bo').value.trim(),n=$('#bn').value.trim();if(!o||!n)return toast('দুটো ঘরই পূরণ করুন');setOp({t:'str',old:o,new:n,exact:false});toast('✅ যোগ হয়েছে')}

   <textarea id="t${i}" rows="2" style="margin-top:6px">${esc(op?op.value:s.value)}</textarea>

function saveLabel(){const v=$('#lab').value,l=S.label;if(!v.trim())return;if(l.pos>=0)setOp({t:'resstr',pos:l.pos,value:v});else setOp({t:'str',old:l.value,new:v,exact:true});toast('✅ যোগ হয়েছে')}

async function vFiles(){
  $('#main').innerHTML=`<div class="card"><b>কনফিগ/টেক্সট ফাইল সরাসরি এডিট</b><div class="mut">base_url, api endpoint, google-services.json, .properties ইত্যাদি যেকোনো টেক্সট ফাইল এখানে পুরোটা খুলে বদলানো যায়।</div>
  <div class="row"><input type="text" id="fq2" placeholder="🔎 ফাইলের নাম খুঁজুন (config, json, url...)" value="${esc(fq)}" oninput="fq=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{vFiles();const i=$('#fq2');i&&i.focus();i&&i.setSelectionRange(99,99)},300)"><div class="mut" id="fcount" style="margin-top:4px">লোড হচ্ছে...</div></div></div>
  <div id="flist"></div><div id="fed"></div>`;
  try{const r=await nat('listFiles',{q:fq});window._fl=r.files;
    $('#fcount').textContent=r.files.length+' টি ফাইল';
    if(window._auto){const j=r.files.findIndex(f=>f.path===window._auto);window._auto=null;if(j>=0)setTimeout(()=>openFile(j),0)}
    $('#flist').innerHTML=r.files.map((x,i)=>{const op=ops.find(o=>o.t==='textfile'&&o.path===x.path);
      return `<div class="card" style="padding:9px 12px;display:flex;align-items:center;gap:8px"><div class="u" style="flex:1;cursor:pointer" onclick="openFile(${i})">${esc(x.path)}</div>${op?'<span class="b ok">✓ পরিবর্তিত</span>':''}</div>`}).join('')||'<div class="card mut">কোনো টেক্সট/কনফিগ ফাইল পাওয়া যায়নি</div>';
  }catch(e){fail(e)}
}
async function openFile(i){
  const x=window._fl[i];fcur=x.path;
  const op=ops.find(o=>o.t==='textfile'&&o.path===fcur);
  $('#fed').innerHTML=`<div class="card"><span class="spin"></span>লোড হচ্ছে...</div>`;
  try{
    const text=op?op.content:(await nat('readFile',{path:fcur})).text;
    fcurText=text;
    $('#fed').innerHTML=`<div class="card"><b class="u">${esc(fcur)}</b>
    <textarea id="ftext" rows="14" spellcheck="false" style="margin-top:8px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px">${esc(text)}</textarea>
    <div class="row"><button class="btn sm" onclick="saveFileEdit()">সেভ</button><button class="btn sec sm" onclick="fcur=null;$('#fed').innerHTML=''">বন্ধ</button></div></div>`;
  }catch(e){$('#fed').innerHTML=`<div class="card" style="color:var(--red)">খোলা যায়নি: ${esc(e.message)}</div>`}
}
function saveFileEdit(){
  const v=$('#ftext').value;
  if(v===fcurText)return toast('কিছু বদলায়নি');
  ops=ops.filter(o=>!(o.t==='textfile'&&o.path===fcur));
  ops.push({t:'textfile',path:fcur,content:v});built=null;upd();toast('✅ যোগ হয়েছে');
}

/* Build */
let ks={use:false,name:'',alias:'',pass:'',keyPass:''};
function desc(o){return o.t==='str'?`টেক্সট/লিংক: ${o.old.slice(0,40)} → ${o.new.slice(0,40)}`+(()=>{const im=impact(o.old,o.new);return im.n?` (${im.n} জায়গায়, ${im.files.length} ফাইলে)`:' (অন্যান্য টেক্সটে খুঁজে বদলাবে)'})():o.t==='resstr'?`রিসোর্স টেক্সট #${o.pos}: ${o.value.slice(0,40)}`:o.t==='rescolor'?`রং #${o.pos}: ${o.value}`:o.t==='delperm'?`পারমিশন সরানো: ${o.name.split('.').pop()}`:o.t==='delfile'?`ফাইল মোছা: ${o.path}`:o.t==='textfile'?`কনফিগ ফাইল এডিট: ${o.path}`:`ছবি বদল: ${o.path}`}
function vBuild(){
  $('#main').innerHTML=`<div class="card"><b>পরিবর্তনের তালিকা (${ops.length})</b>${ops.map((o,i)=>`<div class="perm"><span style="flex:1;font-family:inherit">${esc(desc(o))}</span><button class="btn sec sm" onclick="delIdx(${i})">✕</button></div>`).join('')||'<p class="mut">এখনো কোনো পরিবর্তন নেই</p>'}</div>
  <div class="card"><label class="ck"><input type="checkbox" ${ks.use?'checked':''} onchange="ks.use=this.checked;vBuild()"> নিজের keystore (.p12 / .pfx) দিয়ে সাইন করব</label>
  ${ks.use?`<div class="row"><button class="btn sec sm" onclick="pickKs()">📂 keystore বাছুন</button><span class="mut">${esc(ks.name)}</span></div><div class="row"><input type="text" placeholder="alias (ফাঁকা = প্রথমটি)" value="${esc(ks.alias)}" oninput="ks.alias=this.value"></div><div class="row"><input type="password" placeholder="keystore password" value="${esc(ks.pass)}" oninput="ks.pass=this.value"></div><div class="row"><input type="password" placeholder="key password (একই হলে ফাঁকা)" value="${esc(ks.keyPass)}" oninput="ks.keyPass=this.value"></div>`:`<div class="mut" style="margin-top:6px">ডিফল্ট key ব্যবহার হবে। এতে আগের ইনস্টল করা অ্যাপের ওপর আপডেট হয় না — আগে পুরনোটা আনইনস্টল করুন।</div>`}</div>
  <button class="btn big" id="bb" onclick="doBuild()">🔨 APK তৈরি করুন</button>
  <pre id="log" style="display:none;margin-top:10px"></pre><div id="bres"></div>`;
  if(built)showDone()}
async function pickKs(){try{const r=await nat('pickKeystore');if(!r.cancelled){ks.name=r.name;vBuild()}}catch(e){fail(e)}}
async function doBuild(){if(BUSY)return;if(ks.use&&!ks.name)return toast('আগে keystore বাছুন');BUSY=true;built=null;
  $('#bb').disabled=true;const l=$('#log');l.style.display='block';l.textContent='';$('#bres').innerHTML='';
  try{const r=await nat('build',{ops,ks});built=r;BUSY=false;$('#bb').disabled=false;showDone()}catch(e){BUSY=false;$('#bb').disabled=false;l.textContent+='❌ '+e.message+'\n'}}
function showDone(){$('#bres').innerHTML=`<div class="card" style="margin-top:10px"><b>✅ তৈরি হয়েছে (${(built.size/1048576).toFixed(1)} MB)</b>
  <div class="row"><button class="btn" onclick="act('save')">💾 সেভ করুন</button><button class="btn" onclick="act('install')">⬇ ইনস্টল</button><button class="btn sec" onclick="act('share')">↗ শেয়ার</button></div></div>`}
async function act(m){try{const r=await nat(m);if(r.needPermission)toast('সেটিংসে "এই উৎস থেকে ইনস্টল" চালু করে আবার চাপুন');else if(r.saved)toast('✅ সেভ হয়েছে')}catch(e){fail(e)}}

home();
</script>
</body>
</html>
