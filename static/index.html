<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK Studio</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#1c2230;--mut:#69728a;--line:#e1e5ee;--pri:#3b5bdb;--pri2:#364fc7;--red:#e03131;--grn:#2b8a3e;--warn:#f08c00}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e6e9f2;--mut:#98a2b8;--line:#2b3240;--pri:#5c7cfa;--pri2:#748ffc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Noto Sans Bengali","Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header .sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;display:inline-block}
button:hover{background:var(--pri2)}button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sec:hover{background:var(--bg)}button.del{background:var(--red)}button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;min-height:420px;white-space:pre;tab-size:4}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--mut);cursor:pointer}
.drop.over{border-color:var(--pri);background:rgba(59,91,219,.07)}
.row{display:grid;grid-template-columns:1fr 1.2fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.url{word-break:break-all;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--mut);margin-right:4px}
.mut{color:var(--mut);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar>input[type=text]{flex:1;min-width:160px}.bar>select{width:auto;min-width:160px}
pre.log{background:#0d1117;color:#c9d1d9;padding:12px;border-radius:8px;max-height:360px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.img{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:12px;word-break:break-all}
.img .th{height:96px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#8883 0 25%,transparent 0 50%) 0 0/14px 14px;border-radius:6px;margin-bottom:6px}
.img img{max-width:100%;max-height:96px}
.files{display:grid;grid-template-columns:320px 1fr;gap:12px}
.flist{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.flist div{padding:4px 8px;font-size:12px;cursor:pointer;word-break:break-all;border-bottom:1px solid var(--line)}
.flist div:hover,.flist div.on{background:rgba(59,91,219,.12)}
.sw{width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.perm{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px;font-family:ui-monospace,monospace}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px}
.note{background:rgba(240,140,0,.12);border:1px solid rgba(240,140,0,.4);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media(max-width:760px){.row{grid-template-columns:1fr}.files{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📱 APK Studio</h1><span class="mut" id="pname"></span><span class="sp"></span>
  <button class="sec" id="homeBtn" style="display:none" onclick="goHome()">← সব প্রজেক্ট</button>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PID=null, TAB='urls';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
async function api(path,opt={}){
  if(opt.json!==undefined){opt.method=opt.method||'POST';opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(opt.json);delete opt.json}
  const r=await fetch('/api/'+path,opt);let d;try{d=await r.json()}catch(e){d={}}
  if(!r.ok){toast('❌ '+(d.error||r.status));throw new Error(d.error||r.status)}return d}
const P=p=>`p/${PID}/${p}`;
const enc=encodeURIComponent;

/* ---------- home ---------- */
async function goHome(){
  PID=null;$('#pname').textContent='';$('#homeBtn').style.display='none';
  const list=await api('projects');
  $('#app').innerHTML=`
  <div class="card"><div class="drop" id="drop"><div style="font-size:42px">📦</div>
   <b>এখানে APK ফাইল ড্র্যাগ করুন বা ক্লিক করে বেছে নিন</b>
   <div class="mut">বড় APK (শত MB) হলেও চলবে — ফাইল আপনার কম্পিউটারেই থাকে, কোথাও আপলোড হয় না।</div>
   <input type="file" id="fi" accept=".apk" hidden></div><div id="upst"></div></div>
  <div class="card"><b>আগের প্রজেক্ট</b>${list.length?'':'<div class="mut">এখনো কিছু নেই</div>'}
   ${list.map(p=>`<div class="row" style="grid-template-columns:1fr auto auto"><div>${esc(p.name)} <span class="badge">${p.status}</span><div class="mut">${new Date(p.created*1000).toLocaleString()}</div></div>
   <button onclick="openP('${p.id}','${esc(p.name)}')" ${p.status!=='ready'?'disabled':''}>খুলুন</button>
   <button class="del" onclick="delP('${p.id}')">মুছুন</button></div>`).join('')}</div>`;
  const dz=$('#drop'),fi=$('#fi');
  dz.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&upload(fi.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');e.dataTransfer.files[0]&&upload(e.dataTransfer.files[0])};
}
async function delP(id){if(!confirm('প্রজেক্টটি পুরোপুরি মুছে ফেলবেন?'))return;await api(`p/${id}/delete`,{method:'POST'});goHome()}
async function upload(f){
  $('#upst').innerHTML=`<p>⏳ আপলোড হচ্ছে: ${esc(f.name)} (${(f.size/1048576).toFixed(1)} MB)...</p>`;
  const r=await fetch('/api/upload',{method:'POST',headers:{'X-Filename':enc(f.name)},body:f});
  const d=await r.json();if(!r.ok){$('#upst').innerHTML='❌ '+esc(d.error);return}
  $('#upst').innerHTML=`<p>⚙️ ডিকোড হচ্ছে (বড় অ্যাপে কয়েক মিনিট লাগতে পারে)...</p><pre class="log" id="lg"></pre>`;
  const ok=await pollJob(d.job,$('#lg'));
  if(ok)openP(d.id,f.name);else $('#upst').insertAdjacentHTML('afterbegin','<p>❌ ডিকোড ফেইল</p>');
}
async function pollJob(jid,el){
  let from=0;
  for(;;){const d=await api(`job?id=${jid}&from=${from}`);from=d.next;
    if(d.log.length){el.textContent+=d.log.join('\n')+'\n';el.scrollTop=el.scrollHeight}
    if(d.status!=='running')return d.status==='done';await new Promise(r=>setTimeout(r,700))}
}

/* ---------- project ---------- */
const TABS=[['urls','🔗 URL / লিংক'],['strings','✏️ টেক্সট'],['colors','🎨 রং'],['images','🖼️ আইকন/ছবি'],['manifest','🔐 নাম/পারমিশন'],['search','🔎 খুঁজুন-বদলান'],['files','📁 ফাইল'],['build','📦 বিল্ড']];
function openP(id,name){PID=id;$('#pname').textContent='— '+name;$('#homeBtn').style.display='';tab(TAB)}
function tab(t){TAB=t;
  $('#app').innerHTML=`<div class="tabs">${TABS.map(([k,l])=>`<button class="${k===t?'on':''}" onclick="tab('${k}')">${l}</button>`).join('')}</div><div id="pane"><p class="mut">লোড হচ্ছে...</p></div>`;
  ({urls:tUrls,strings:tStrings,colors:tColors,images:tImages,manifest:tManifest,search:tSearch,files:tFiles,build:tBuild})[t]()}

/* URLs */
let URLS=[];
async function tUrls(){
  URLS=await api(P('urls'));
  $('#pane').innerHTML=`
  <div class="card"><b>ডোমেইন/প্রিফিক্স একসাথে বদলান</b><div class="mut">যেমন: <code>https://old.com</code> → <code>https://new.com</code> — সব ফাইলে (কোড, স্ট্রিং, assets) বদলাবে</div>
  <div class="bar" style="margin-top:8px"><input type="text" id="bo" placeholder="পুরনো (যেমন https://old.com)"><input type="text" id="bn" placeholder="নতুন (যেমন https://new.com)"><button onclick="bulk()">সব বদলান</button></div></div>
  <div class="card"><div class="bar"><input type="text" id="uq" placeholder="URL ফিল্টার..." oninput="drawUrls()">
  <label class="ck"><input type="checkbox" id="noise" onchange="drawUrls()"> সিস্টেম/লাইব্রেরির লিংকও দেখান</label><span class="mut" id="ucnt"></span></div><div id="ul"></div></div>`;
  drawUrls()}
function drawUrls(){
  const q=($('#uq').value||'').toLowerCase(),nz=$('#noise').checked;
  const l=URLS.filter(u=>(nz||!u.noise)&&u.url.toLowerCase().includes(q));
  $('#ucnt').textContent=l.length+' টি লিংক';
  $('#ul').innerHTML=l.slice(0,400).map((u,i)=>`<div class="row"><div><div class="url">${esc(u.url)}</div>
   <div>${u.kinds.map(k=>`<span class="badge">${k}</span>`).join('')}<span class="mut">${u.count} জায়গায়</span></div>
   <details class="mut"><summary>ফাইল</summary>${u.files.map(f=>esc(f.path)+' ×'+f.n).join('<br>')}</details></div>
   <input type="text" value="${esc(u.url)}" data-u="${esc(u.url)}" id="nu${i}">
   <button onclick="saveUrl(${i})" data-i="${i}">সেভ</button></div>`).join('')||'<p class="mut">কিছু পাওয়া যায়নি</p>';
  window._ul=l}
async function saveUrl(i){const u=window._ul[i],nv=$('#nu'+i).value.trim();if(!nv||nv===u.url)return toast('কিছু বদলায়নি');
  const r=await api(P('replace-url'),{json:{old:u.url,new:nv}});toast(`✅ ${r.changed.length} টি ফাইলে বদলেছে`);tUrls()}
async function bulk(){const o=$('#bo').value,n=$('#bn').value;if(!o||!n)return toast('দুটো ঘরই পূরণ করুন');
  const r=await api(P('replace'),{json:{q:o,r:n,case:true}});toast(`✅ ${r.changed.length} টি ফাইলে বদলেছে`);tUrls()}

/* strings & colors */
async function valuesTab(kind,file){
  const d=await api(P(kind)+(file?'?file='+enc(file):''));window._vf=d.file;window._vk=kind;window._vi=d.items;
  const isC=kind==='colors';
  $('#pane').innerHTML=`<div class="card"><div class="bar"><select id="vf" onchange="valuesTab('${kind}',this.value)">${d.files.map(f=>`<option ${f===d.file?'selected':''}>${f}</option>`).join('')}</select>
  <input type="text" id="vq" placeholder="ফিল্টার..." oninput="drawV()"><span class="mut" id="vc"></span></div>
  ${isC?'':'<div class="note">মান XML-escaped আকারে দেখানো হয় (যেমন <code>&amp;amp;</code>, <code>\\\'</code> )। কোনো ভাষার (values-bn ইত্যাদি) ফাইল উপরের ড্রপডাউন থেকে বদলান।</div>'}
  <div id="vl"></div>
  <div class="bar" style="margin-top:12px"><input type="text" id="an" placeholder="নতুন নাম"><input type="text" id="av" placeholder="${isC?'#RRGGBB':'মান'}"><button onclick="addV()">+ যোগ করুন</button></div></div>`;
  drawV()}
function drawV(){const q=($('#vq').value||'').toLowerCase(),isC=window._vk==='colors';
  const l=window._vi.filter(x=>x.name.toLowerCase().includes(q)||x.value.toLowerCase().includes(q));
  $('#vc').textContent=l.length+' টি';
  $('#vl').innerHTML=l.slice(0,500).map((x,i)=>{const hx=/^#([0-9a-f]{6}|[0-9a-f]{8})$/i.test(x.value.trim());
   const c6=hx?'#'+x.value.trim().slice(-6):'#000000';
   return `<div class="row" style="grid-template-columns:200px 1fr auto auto"><div class="url">${esc(x.name)}</div>
   <div style="display:flex;gap:6px">${isC?`<input type="color" class="sw" value="${c6}" oninput="colorPick(this)" ${hx?'':'disabled'}>`:''}${isC||x.value.length<80?`<input type="text" value="${esc(x.value)}" id="v${i}">`:`<textarea id="v${i}" style="min-height:70px;white-space:pre-wrap">${esc(x.value)}</textarea>`}</div>
   <button onclick="setV('${esc(x.name)}','v${i}')">সেভ</button><button class="del" onclick="delV('${esc(x.name)}')">✕</button></div>`}).join('')||'<p class="mut">কিছু নেই</p>'}
function colorPick(el){const t=el.nextElementSibling,old=t.value.trim();t.value=(old.length===9?old.slice(0,3):'#')+el.value.slice(1).toUpperCase()}
async function setV(n,id){await api(P(window._vk),{json:{file:window._vf,name:n,value:$('#'+id).value}});toast('✅ সেভ হয়েছে');valuesTab(window._vk,window._vf)}
async function delV(n){if(!confirm(n+' মুছবেন? (অন্য জায়গায় ব্যবহার থাকলে বিল্ড ফেইল হতে পারে)'))return;await api(P(window._vk),{json:{op:'delete',file:window._vf,name:n}});toast('মুছেছে');valuesTab(window._vk,window._vf)}
async function addV(){const n=$('#an').value.trim(),v=$('#av').value;if(!n)return;await api(P(window._vk),{json:{file:window._vf,name:n,value:v}});toast('✅ যোগ হয়েছে');valuesTab(window._vk,window._vf)}
const tStrings=()=>valuesTab('strings'),tColors=()=>valuesTab('colors');

/* images */
async function tImages(){
  $('#pane').innerHTML=`<div class="card"><b>এক ছবি → সব লঞ্চার আইকন</b><div class="mut">ছবি বেছে নিলে প্রতিটি ic_launcher ফাইলের মাপে স্বয়ংক্রিয়ভাবে ছোট/বড় হয়ে বসবে (PNG/WebP)।</div>
  <div class="bar" style="margin-top:8px"><input type="file" id="allic" accept="image/*"><button onclick="allIcons()">সব লঞ্চার আইকনে বসান</button></div></div>
  <div class="card"><div class="bar"><input type="text" id="iq" placeholder="ফিল্টার (যেমন logo, splash, ic_launcher)..." oninput="drawImgs()"></div><div class="grid" id="ig"></div></div>`;
  drawImgs()}
let _it;async function drawImgs(){clearTimeout(_it);_it=setTimeout(async()=>{
  const l=await api(P('images')+'?q='+enc($('#iq').value||''));window._im=l;
  $('#ig').innerHTML=l.map((x,i)=>`<div class="img"><div class="th"><img loading="lazy" src="/api/${P('raw')}?path=${enc(x.path)}&t=${Date.now()}"></div>${esc(x.path.replace(/^res\//,''))}<br><span class="mut">${(x.size/1024).toFixed(1)} KB</span><br>
  <label class="btn sec" style="margin-top:4px;padding:3px 10px;cursor:pointer;border:1px solid var(--line)">বদলান<input type="file" accept="image/*" hidden onchange="repImg(${i},this.files[0])"></label>
  <button class="del" style="padding:3px 8px" onclick="delImg(${i})">✕</button></div>`).join('')||'<p class="mut">কোনো ছবি নেই</p>'},250)}
function loadImg(file){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
async function scaled(file,w,h,path){const im=await loadImg(file),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const s=Math.min(w/im.naturalWidth,h/im.naturalHeight);const dw=im.naturalWidth*s,dh=im.naturalHeight*s;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
  const ext=path.split('.').pop().toLowerCase(),mt=ext==='png'?'image/png':ext==='webp'?'image/webp':'image/jpeg';
  return new Promise(r=>c.toBlob(r,mt,.95))}
async function currentSize(path){const im=new Image();im.src=`/api/${P('raw')}?path=${enc(path)}&t=${Date.now()}`;await im.decode();return[im.naturalWidth,im.naturalHeight]}
async function repImg(i,f){if(!f)return;const p=window._im[i].path;
  let blob=f;if(/\.(png|webp|jpe?g)$/i.test(p)){const[w,h]=await currentSize(p);blob=await scaled(f,w,h,p)}
  await api(P('upload-file')+'?path='+enc(p),{method:'POST',body:blob});toast('✅ বদলেছে');drawImgs()}
async function allIcons(){const f=$('#allic').files[0];if(!f)return toast('আগে ছবি বেছে নিন');
  const l=await api(P('images')+'?q=ic_launcher');let n=0;
  for(const x of l){if(!/\.(png|webp)$/i.test(x.path))continue;try{const[w,h]=await currentSize(x.path);const b=await scaled(f,w,h,x.path);
   await api(P('upload-file')+'?path='+enc(x.path),{method:'POST',body:b});n++}catch(e){}}
  toast(`✅ ${n} টি আইকন বদলেছে`);drawImgs()}
async function delImg(i){if(!confirm('ছবি মুছবেন?'))return;await api(P('file')+'?path='+enc(window._im[i].path),{method:'DELETE'});drawImgs()}

/* manifest */
async function tManifest(){
  const m=await api(P('manifest'));
  $('#pane').innerHTML=`<div class="card"><div class="note">⚠ প্যাকেজ নাম বদলালে এটি নতুন অ্যাপ হিসেবে গণ্য হবে। Firebase/Google Services বা deep-link থাকলে কাজ না-ও করতে পারে। না জানলে ফাঁকা রেখে দিন (বদলাবে না)।</div>
  <div class="row" style="grid-template-columns:200px 1fr"><b>অ্যাপের নাম</b><input type="text" id="ml" value="${esc(m.label)}"></div>
  <div class="mut" style="margin:-6px 0 8px 0">(নাম <code>@string/…</code> হলে strings.xml এর মান বদলায়; নইলে সরাসরি)</div>
  <div class="row" style="grid-template-columns:200px 1fr"><b>প্যাকেজ নাম</b><input type="text" id="mp" value="${esc(m.package)}"></div>
  <div class="row" style="grid-template-columns:200px 1fr"><b>Version Name</b><input type="text" id="mvn" value="${esc(m.versionName)}"></div>
  <div class="row" style="grid-template-columns:200px 1fr"><b>Version Code</b><input type="number" id="mvc" value="${esc(m.versionCode)}"></div>
  <div class="row" style="grid-template-columns:200px 1fr"><b>HTTP (http://) অনুমতি</b><label class="ck"><input type="checkbox" id="mct" ${m.cleartext?'checked':''}> usesCleartextTraffic চালু (নতুন সাইট http হলে লাগে)</label></div></div>
  <div class="card"><b>পারমিশন</b> <span class="mut">— যেটা সরাতে চান টিক দিন</span>
  ${m.permissions.map((p,i)=>`<div class="perm"><input type="checkbox" class="rp" value="${esc(p)}">${esc(p)}</div>`).join('')||'<p class="mut">কোনো পারমিশন নেই</p>'}
  <div class="bar" style="margin-top:10px"><input type="text" id="ap" placeholder="নতুন পারমিশন, যেমন android.permission.INTERNET"></div></div>
  <button onclick="saveManifest()">সেভ করুন</button>`}
async function saveManifest(){
  const rm=[...document.querySelectorAll('.rp:checked')].map(x=>x.value),ap=$('#ap').value.trim();
  await api(P('manifest'),{json:{label:$('#ml').value,package:$('#mp').value,versionName:$('#mvn').value,versionCode:$('#mvc').value,cleartext:$('#mct').checked,remove_permissions:rm,add_permissions:ap?[ap]:[]}});
  toast('✅ সেভ হয়েছে');tManifest()}

/* search */
function tSearch(){
  $('#pane').innerHTML=`<div class="card"><div class="mut">সব টেক্সট ফাইলে (কোড, XML, HTML/JS assets) খুঁজে বদলান — AdMob ID, API key, Firebase URL, ইমেইল ইত্যাদির জন্য উপযোগী।</div>
  <div class="bar" style="margin-top:8px"><input type="text" id="sq" placeholder="যা খুঁজবেন" onkeydown="event.key==='Enter'&&doSearch()"><input type="text" id="sr" placeholder="যা দিয়ে বদলাবেন">
  <label class="ck"><input type="checkbox" id="sc"> বড়/ছোট হাতের</label><label class="ck"><input type="checkbox" id="sx"> Regex</label>
  <button onclick="doSearch()">খুঁজুন</button><button class="del" onclick="doRepl()">সব বদলান</button></div><div id="sres"></div></div>`}
async function doSearch(){const r=await api(P('search'),{json:{q:$('#sq').value,case:$('#sc').checked,regex:$('#sx').checked}});
  $('#sres').innerHTML=`<p class="mut">${r.results.length} টি ফাইলে পাওয়া গেছে</p>`+r.results.map(x=>`<div class="row" style="grid-template-columns:1fr"><div><a href="#" onclick="openFile('${esc(x.path)}');return false">${esc(x.path)}</a> <span class="badge">${x.n}</span>
  <div class="url mut">${x.snips.map(esc).join('<br>')}</div></div></div>`).join('')}
async function doRepl(){if(!confirm('সব ফাইলে বদলাবেন?'))return;
  const r=await api(P('replace'),{json:{q:$('#sq').value,r:$('#sr').value,case:$('#sc').checked,regex:$('#sx').checked}});toast(`✅ ${r.changed.length} টি ফাইলে বদলেছে`);doSearch()}

/* files */
let CUR=null;
async function tFiles(){
  $('#pane').innerHTML=`<div class="files"><div class="card"><input type="text" id="fq" placeholder="ফাইল খুঁজুন..." oninput="drawFiles()"><div class="flist" id="fl" style="margin-top:8px"></div>
  <div class="mut" style="margin-top:8px">নতুন ফাইল যোগ / বদল:</div><input type="text" id="np" placeholder="পাথ, যেমন assets/logo.png"><label class="btn sec" style="margin-top:6px;cursor:pointer;border:1px solid var(--line)">ফাইল বেছে আপলোড<input type="file" hidden onchange="upNew(this.files[0])"></label></div>
  <div class="card" id="ed"><span class="mut">বাম থেকে ফাইল বেছে নিন</span></div></div>`;drawFiles()}
let _ft;function drawFiles(){clearTimeout(_ft);_ft=setTimeout(async()=>{const l=await api(P('files')+'?q='+enc($('#fq').value||''));
  $('#fl').innerHTML=l.map(f=>`<div class="${f===CUR?'on':''}" onclick="openFile('${esc(f)}')">${esc(f)}</div>`).join('')},200)}
async function openFile(p){if(TAB!=='files'){TAB='files';tab('files');await new Promise(r=>setTimeout(r,300))}
  CUR=p;const ed=$('#ed');const isImg=/\.(png|jpe?g|webp|gif|svg)$/i.test(p);
  const head=`<div class="bar"><b class="url" style="flex:1">${esc(p)}</b>`;
  if(isImg){ed.innerHTML=head+`<label class="btn sec" style="cursor:pointer;border:1px solid var(--line)">বদলান<input type="file" hidden onchange="upCur(this.files[0])"></label><button class="del" onclick="delCur()">মুছুন</button></div><img style="max-width:100%" src="/api/${P('raw')}?path=${enc(p)}&t=${Date.now()}">`;return}
  try{const d=await api(P('file')+'?path='+enc(p));
   ed.innerHTML=head+`<button onclick="saveCur()">সেভ</button><button class="del" onclick="delCur()">মুছুন</button></div><textarea id="tx" spellcheck="false"></textarea>`;$('#tx').value=d.text}
  catch(e){ed.innerHTML=head+`<label class="btn sec" style="cursor:pointer;border:1px solid var(--line)">ফাইল বদলান<input type="file" hidden onchange="upCur(this.files[0])"></label><button class="del" onclick="delCur()">মুছুন</button></div><p class="mut">বাইনারি ফাইল — টেক্সট হিসেবে খোলা যায় না।</p>`}
  drawFiles()}
async function saveCur(){await api(P('file')+'?path='+enc(CUR),{json:{text:$('#tx').value}});toast('✅ সেভ হয়েছে')}
async function delCur(){if(!confirm(CUR+' মুছবেন?'))return;await api(P('file')+'?path='+enc(CUR),{method:'DELETE'});CUR=null;tFiles()}
async function upCur(f){if(!f)return;await api(P('upload-file')+'?path='+enc(CUR),{method:'POST',body:f});toast('✅ বদলেছে');openFile(CUR)}
async function upNew(f){const p=$('#np').value.trim();if(!f||!p)return toast('পাথ লিখুন ও ফাইল বেছে নিন');await api(P('upload-file')+'?path='+enc(p),{method:'POST',body:f});toast('✅ যোগ হয়েছে');drawFiles()}

/* build */
function tBuild(){
  $('#pane').innerHTML=`<div class="card"><div class="note">ℹ️ বিল্ড করলে APK নতুন key দিয়ে সাইন হয়। আগের ইনস্টল করা অ্যাপের ওপর আপডেট না হয়ে আগে সেটা আনইনস্টল করতে হতে পারে। Play Store এ আপডেট দিতে চাইলে নিজের keystore দিন (নিচে)।</div>
  <label class="ck"><input type="checkbox" id="uk" onchange="$('#kso').style.display=this.checked?'block':'none'"> নিজের keystore (.jks/.keystore) ব্যবহার করব</label>
  <div id="kso" style="display:none;margin-top:10px"><input type="file" id="kf"><div class="bar" style="margin-top:8px"><input type="text" id="ka" placeholder="alias"><input type="password" id="kp" placeholder="keystore password"><input type="password" id="kk" placeholder="key password (একই হলে ফাঁকা)"></div></div>
  <div style="margin-top:12px"><button onclick="doBuild()" id="bb">🔨 বিল্ড ও সাইন করুন</button> <a class="btn sec" style="border:1px solid var(--line);color:var(--ink);text-decoration:none" href="/api/${P('download-src')}">ডিকোড করা সোর্স (zip)</a></div>
  <div id="bres"></div><pre class="log" id="blog" style="display:none"></pre></div>`}
async function doBuild(){
  const uk=$('#uk').checked;
  if(uk){const f=$('#kf').files[0];if(!f)return toast('keystore বেছে নিন');await api(P('keystore'),{method:'POST',body:f})}
  $('#bb').disabled=true;const lg=$('#blog');lg.style.display='block';lg.textContent='';$('#bres').innerHTML='';
  const j=await api(P('build'),{json:{use_keystore:uk,alias:$('#ka')?.value||'',ks_pass:$('#kp')?.value||'',key_pass:$('#kk')?.value||''}});
  const ok=await pollJob(j.job,lg);$('#bb').disabled=false;
  $('#bres').innerHTML=ok?`<p><a class="btn" style="text-decoration:none" href="/api/${P('download-apk')}">⬇ APK ডাউনলোড করুন</a></p>`:'<p style="color:var(--red)">❌ বিল্ড ফেইল — লগ দেখুন</p>'}

goHome();
</script>
</body>
</html>
